---
- name: Install Docker prerequisites
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
    state: present
    update_cache: true

- name: Create Docker keyrings directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

- name: Download Docker GPG key
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/ubuntu/gpg
    dest: /etc/apt/keyrings/docker.asc
    mode: "0644"

- name: Add Docker repository
  ansible.builtin.apt_repository:
    repo: >-
      deb [arch={{ 'arm64' if ansible_facts.architecture == 'aarch64' else 'amd64' }}
      signed-by=/etc/apt/keyrings/docker.asc]
      https://download.docker.com/linux/ubuntu
      {{ ansible_facts.distribution_release }} stable
    filename: docker
    state: present
    update_cache: true

- name: Install Docker Engine
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present

- name: Ensure Docker is running
  ansible.builtin.service:
    name: docker
    state: started
    enabled: true

- name: Add ubuntu user to docker group
  ansible.builtin.user:
    name: ubuntu
    groups: docker
    append: true

- name: Create application directory
  ansible.builtin.file:
    path: /opt/dockerized-nodejs-service
    state: directory
    owner: ubuntu
    group: ubuntu
    mode: "0755"

- name: Create application environment file
  ansible.builtin.copy:
    dest: /opt/dockerized-nodejs-service/.env
    owner: ubuntu
    group: ubuntu
    mode: "0600"
    content: |
      PORT=3000
      SECRET_MESSAGE={{ secret_message }}
      USERNAME={{ username }}
      PASSWORD={{ password }}

- name: Pull application image
  community.docker.docker_image:
    name: ghcr.io/tommycontreras11/dockerized-nodejs-service
    tag: latest
    source: pull

- name: Remove existing application container
  community.docker.docker_container:
    name: dockerized-nodejs-service
    state: absent

- name: Start application container
  community.docker.docker_container:
    name: dockerized-nodejs-service
    image: ghcr.io/tommycontreras11/dockerized-nodejs-service:latest
    state: started
    restart_policy: unless-stopped
    env_file: /opt/dockerized-nodejs-service/.env
    ports:
      - "3000:3000"